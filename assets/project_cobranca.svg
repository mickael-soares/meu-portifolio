<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="fintechBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061c14"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="darkWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1712"/>
      <stop offset="100%" stop-color="#050d0a"/>
    </linearGradient>
    <filter id="shadowFintech" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#fintechBg)"/>
  
  <!-- Grid Lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#134e4a" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#134e4a" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Main Window -->
  <g filter="url(#shadowFintech)" transform="translate(60, 40)">
    <!-- Container -->
    <rect width="680" height="370" rx="16" fill="url(#darkWindow)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Topbar -->
    <rect width="680" height="46" rx="16" fill="#04120c"/>
    <rect y="36" width="680" height="10" fill="#04120c"/>
    <line x1="0" y1="46" x2="680" y2="46" stroke="#134e4a" stroke-width="1"/>
    
    <!-- Dots -->
    <circle cx="25" cy="23" r="5.5" fill="#ef4444"/>
    <circle cx="43" cy="23" r="5.5" fill="#f59e0b"/>
    <circle cx="61" cy="23" r="5.5" fill="#10b981"/>

    <!-- Breadcrumb / Status -->
    <rect x="90" y="12" width="220" height="22" rx="6" fill="#082016"/>
    <text x="105" y="27" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="500">api.cobranca.io • NestJS 12</text>

    <rect x="520" y="12" width="140" height="22" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="0.8"/>
    <text x="535" y="27" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚡ PIX Dinâmico &amp; RLS</text>

    <!-- KPI Metrics Row -->
    <g transform="translate(25, 65)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="195" height="75" rx="10" fill="#091f16" stroke="#164e38" stroke-width="1"/>
      <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Faturado no Mês</text>
      <text x="16" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">R$ 54.820,00</text>
      <text x="16" y="68" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">▲ +14% vs mês anterior</text>

      <!-- KPI 2 -->
      <rect x="215" y="0" width="195" height="75" rx="10" fill="#091f16" stroke="#164e38" stroke-width="1"/>
      <text x="231" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Liquidações PIX Instantâneas</text>
      <text x="231" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="700">98.4%</text>
      <text x="231" y="68" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Webhooks processados em 120ms</text>

      <!-- KPI 3 -->
      <rect x="430" y="0" width="200" height="75" rx="10" fill="#091f16" stroke="#164e38" stroke-width="1"/>
      <text x="446" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Régua de Notificações WhatsApp</text>
      <text x="446" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1.240 Envios</text>
      <text x="446" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">Padrão E.164 • Automação D-3 / D0</text>
    </g>

    <!-- Transactions List & PIX Simulation -->
    <g transform="translate(25, 160)">
      <rect x="0" y="0" width="410" height="185" rx="10" fill="#091a13" stroke="#164e38" stroke-width="1"/>
      <text x="16" y="25" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Últimas Transações Conciliadas</text>

      <!-- Tx 1 -->
      <rect x="12" y="38" width="386" height="42" rx="6" fill="#0e2b20" stroke="#16593e" stroke-width="0.8"/>
      <circle cx="32" cy="59" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="27" y="63" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✓</text>
      <text x="50" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Assinatura Mensal - Plano Pro</text>
      <text x="50" y="69" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">PIX Conciliado • ID #TX-9021</text>
      <text x="320" y="62" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">R$ 189,90</text>

      <!-- Tx 2 -->
      <rect x="12" y="86" width="386" height="42" rx="6" fill="#0e2b20" stroke="#16593e" stroke-width="0.8"/>
      <circle cx="32" cy="107" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="27" y="111" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✓</text>
      <text x="50" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Licença Anual Corporativa</text>
      <text x="50" y="117" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">Boleto Liquidado • ID #TX-8975</text>
      <text x="310" y="110" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">R$ 1.850,00</text>

      <!-- Tx 3 -->
      <rect x="12" y="134" width="386" height="42" rx="6" fill="#0e2b20" stroke="#16593e" stroke-width="0.8"/>
      <circle cx="32" cy="155" r="10" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="26" y="159" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">💬</text>
      <text x="50" y="150" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Notificação WhatsApp Disparada</text>
      <text x="50" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Vencimento em 3 dias • Cliente #442</text>
      <text x="325" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Pendente</text>
    </g>

    <!-- Side Mini Panel: QR Code PIX Preview -->
    <g transform="translate(450, 160)">
      <rect x="0" y="0" width="205" height="185" rx="10" fill="#091a13" stroke="#164e38" stroke-width="1"/>
      <text x="16" y="25" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Emissão de PIX Dinâmico</text>

      <!-- QR Code Simulation Box -->
      <rect x="42" y="38" width="120" height="95" rx="8" fill="#ffffff"/>
      <rect x="52" y="48" width="30" height="30" fill="#000000"/>
      <rect x="56" y="52" width="22" height="22" fill="#ffffff"/>
      <rect x="62" y="58" width="10" height="10" fill="#000000"/>
      
      <rect x="122" y="48" width="30" height="30" fill="#000000"/>
      <rect x="126" y="52" width="22" height="22" fill="#ffffff"/>
      <rect x="132" y="58" width="10" height="10" fill="#000000"/>

      <rect x="52" y="93" width="30" height="30" fill="#000000"/>
      <rect x="56" y="97" width="22" height="22" fill="#ffffff"/>
      <rect x="62" y="103" width="10" height="10" fill="#000000"/>

      <rect x="95" y="52" width="15" height="15" fill="#000000"/>
      <rect x="95" y="75" width="20" height="12" fill="#000000"/>
      <rect x="122" y="93" width="18" height="25" fill="#000000"/>

      <text x="35" y="152" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Copia e Cola + Conciliação</text>
      <text x="48" y="168" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9">Precisão em centavos (ACID)</text>
    </g>
  </g>
</svg>
