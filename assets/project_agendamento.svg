<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Main App Window Frame -->
  <g filter="url(#shadow)" transform="translate(60, 40)">
    <!-- Window Container -->
    <rect width="680" height="370" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect width="680" height="46" rx="16" fill="#0f172a"/>
    <rect y="36" width="680" height="10" fill="#0f172a"/>
    <line x1="0" y1="46" x2="680" y2="46" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Dots -->
    <circle cx="25" cy="23" r="5.5" fill="#ef4444"/>
    <circle cx="43" cy="23" r="5.5" fill="#f59e0b"/>
    <circle cx="61" cy="23" r="5.5" fill="#10b981"/>

    <!-- App Title / Slug -->
    <rect x="90" y="12" width="230" height="22" rx="6" fill="#1e293b"/>
    <text x="105" y="27" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">app.clinica.com/bella-pelle</text>

    <rect x="530" y="12" width="130" height="22" rx="6" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="548" y="27" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SaaS Multi-tenant</text>

    <!-- Sidebar Mini -->
    <rect x="0" y="47" width="160" height="323" fill="#090d16" fill-opacity="0.6"/>
    <line x1="160" y1="47" x2="160" y2="370" stroke="#334155" stroke-width="1"/>

    <text x="24" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Agenda Pro</text>
    <text x="24" y="96" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Clínica Bella Pelle</text>

    <rect x="16" y="120" width="128" height="28" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="36" y="138" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📅 Calendário</text>

    <rect x="16" y="156" width="128" height="28" rx="6" fill="transparent"/>
    <text x="36" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">🚪 Salas / Cabines</text>

    <rect x="16" y="192" width="128" height="28" rx="6" fill="transparent"/>
    <text x="36" y="210" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">👥 Profissionais</text>

    <rect x="16" y="228" width="128" height="28" rx="6" fill="transparent"/>
    <text x="36" y="246" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">⚙️ Regras Agenda</text>

    <!-- Main Content Area -->
    <!-- Content Header -->
    <text x="185" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Grade de Agendamentos</text>
    <text x="185" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Hoje • 01 de Novembro — 4 cabines ativas</text>

    <!-- Room / Cabin Columns -->
    <g transform="translate(185, 120)">
      <!-- Cabine 1 -->
      <rect x="0" y="0" width="150" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="150" height="30" rx="8" fill="#1e293b"/>
      <text x="10" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cabine 01 (Laser)</text>
      
      <!-- Appointment Card 1 -->
      <rect x="8" y="40" width="134" height="60" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
      <text x="16" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">09:00 - 10:00</text>
      <text x="16" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dra. Camila Soares</text>
      <text x="16" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Depilação a Laser</text>

      <!-- Appointment Card 2 -->
      <rect x="8" y="110" width="134" height="60" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="16" y="126" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">10:30 - 11:30</text>
      <text x="16" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Fernanda Lima</text>
      <text x="16" y="156" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Rejuvenescimento</text>

      <!-- Cabine 2 -->
      <rect x="160" y="0" width="150" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="160" y="0" width="150" height="30" rx="8" fill="#1e293b"/>
      <text x="170" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cabine 02 (Facial)</text>
      
      <!-- Appointment Card 3 -->
      <rect x="168" y="40" width="134" height="60" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
      <text x="176" y="56" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10" font-weight="700">09:30 - 11:00</text>
      <text x="176" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Juliana Ribeiro</text>
      <text x="176" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Harmonização</text>

      <rect x="168" y="110" width="134" height="90" rx="6" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-dasharray="4 4"/>
      <text x="190" y="155" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Horário Livre</text>
      <text x="180" y="172" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Disponível no Link Público</text>

      <!-- Cabine 3 -->
      <rect x="320" y="0" width="150" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <rect x="320" y="0" width="150" height="30" rx="8" fill="#1e293b"/>
      <text x="330" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sala de Avaliação</text>

      <rect x="328" y="40" width="134" height="60" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
      <text x="336" y="56" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">11:00 - 11:45</text>
      <text x="336" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Carlos Eduardo</text>
      <text x="336" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Primeira Consulta</text>
    </g>
  </g>
</svg>
